services:
  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    container_name: icestream-iceberg-rest
    hostname: iceberg-rest

    ports:
      - "8181:8181"

    environment:
      CATALOG_WAREHOUSE: s3://icestream/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"

      AWS_ACCESS_KEY_ID: icestream
      AWS_SECRET_ACCESS_KEY: icestream-minio
      AWS_REGION: us-east-1

    networks:
      - icestream-network

    restart: unless-stopped

networks:
  icestream-network:
    external: true