version: '3.8'

services:
  flink-jobmanager:
    image: flink:1.18.1-scala_2.12-java11
    container_name: icestream-flink-jobmanager
    hostname: flink-jobmanager
    restart: unless-stopped
    ports:
      - "8081:8081"
      - "6123:6123"
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      JOB_MANAGER_RPC_PORT: 6123
      TASK_MANAGER_NUMBER_OF_TASK_SLOTS: 2
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.rpc.port: 6123
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 2
        state.backend: hashmap
        state.backend.async: false
        taskmanager.memory.process.size: 1g
        jobmanager.memory.process.size: 1g
    networks:
      - icestream-network
    volumes:
      - /opt/flink/usrlib
    command: jobmanager
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s http://localhost:8081/overview | grep -q 'Running' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  flink-taskmanager:
    image: flink:1.18.1-scala_2.12-java11
    container_name: icestream-flink-taskmanager
    hostname: flink-taskmanager
    restart: unless-stopped
    depends_on:
      - flink-jobmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      JOB_MANAGER_RPC_PORT: 6123
      TASK_MANAGER_NUMBER_OF_TASK_SLOTS: 2
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.rpc.port: 6123
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 1g
    networks:
      - icestream-network
    volumes:
      - /opt/flink/usrlib
    command: taskmanager
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s http://flink-jobmanager:8081/taskmanagers | grep -q 'flink-taskmanager' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  icestream-network:
    name: icestream-network
    external: true
